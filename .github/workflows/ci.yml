name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=weftscan --cov-report=term

      - name: Check project structure
        shell: bash
        run: |
          test -f weftscan/main.py && echo "weftscan/main.py present" || exit 1
          test -f requirements.txt && echo "requirements.txt present" || exit 1
          test -f README.md && echo "README.md present" || exit 1
